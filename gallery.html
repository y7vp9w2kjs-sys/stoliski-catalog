<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#30b48d">
<meta property="og:title" content="StoliSki – תמונות הדירה">
<meta property="og:description" content="חופשת סקי בואל טורנס – דירות Ski-in/Ski-out">
<title>StoliSki – תמונות הדירה</title>
<style>
  :root{--brand:#30b48d;--brand-dk:#22936f;--text:#1c2430;--muted:#66707f;--chip:#eef3f8;--line:#e3e7ee}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif}
  .ltr{direction:ltr}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:20px;color:var(--brand-dk)}
  .logo small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .hero{position:relative;background:#0f1620}
  .hero img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;max-height:60vh}
  .hero .cnt{position:absolute;bottom:10px;left:12px;background:rgba(0,0,0,.55);color:#fff;padding:2px 9px;border-radius:6px;font-size:12px;direction:ltr}
  .hero .arrow{position:absolute;top:calc(50% - 22px);width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.85);font-size:22px;cursor:pointer}
  .hero .prev{right:10px}.hero .next{left:10px}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:6px}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.85;border:2px solid transparent}
  .thumbs img.on{opacity:1;border-color:var(--brand)}
  main{padding:14px 16px 40px;max-width:820px;margin:0 auto}
  h1{margin:0 0 2px;font-size:22px}
  .res{color:var(--muted);margin-bottom:12px}
  .facts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .fact{background:var(--chip);border-radius:8px;padding:6px 10px;font-size:14px;white-space:nowrap}
  h3{margin:18px 0 6px;font-size:14px;color:var(--muted);letter-spacing:.03em}
  ul{margin:0;padding-inline-start:20px}
  li{margin:3px 0}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{background:#dff5ec;color:var(--brand-dk);border-radius:999px;padding:3px 10px;font-size:13px}
  .cta{margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fafcfb;text-align:center}
  .cta a{display:inline-block;background:#25d366;color:#fff;text-decoration:none;font-weight:700;padding:10px 18px;border-radius:999px;margin-top:8px}
  .lb{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:50;touch-action:pan-y}
  .lb.open{display:flex}
  .lb img{max-width:100vw;max-height:100vh;object-fit:contain}
  .lb .x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;width:40px;height:40px;font-size:22px}
  .lb .cnt{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;direction:ltr}
  .missing{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header><div class="logo">StoliSki<small>חופשות סקי · ואל טורנס</small></div></header>
<div id="app"></div>
<div class="lb" id="lb"><button class="x" id="lbx">✕</button><img id="lbimg" alt=""><span class="cnt" id="lbcnt"></span></div>
<script src="data/apartments.js?v=4"></script>
<script>
const LABELS = {HAS_SKI_IN_SKI_OUT:'Ski-in / Ski-out', HAS_BALCONY_TERRASSE:'מרפסת', HAS_DISHWASHER:'מדיח', HAS_TV:'טלוויזיה', HAS_AIR_CONDITIONING:'מיזוג', HAS_WASHER:'מכונת כביסה', HAS_ELEVATOR:'מעלית', HAS_COFFEE_MAKER:'מכונת קפה'};
const AGENCY_WA = '972555081868';
const id = new URLSearchParams(location.search).get('a');
const a = (window.APARTMENTS||[]).find(x=>x.id===id);
const app = document.getElementById('app');
let idx = 0;
if(!a){
  app.innerHTML = '<div class="missing">הדירה לא נמצאה. בדקו את הקישור.</div>';
} else {
  document.title = `StoliSki – ${a.name}`;
  const ph = a.photos;
  app.innerHTML = `
    <div class="hero">
      <img id="main" src="${ph[0]?ph[0].file:''}" alt="">
      <button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button>
      <span class="cnt" id="cnt">1 / ${ph.length}</span>
    </div>
    <div class="thumbs" id="thumbs">${ph.map((p,i)=>`<img src="${p.file}" data-i="${i}" class="${i===0?'on':''}" loading="lazy" alt="">`).join('')}</div>
    <main>
      <h1>${a.name}</h1>
      <div class="res">${a.residence} · ואל טורנס</div>
      <div class="facts">
        <span class="fact">👥 עד ${a.maxGuests} אורחים</span>
        <span class="fact">🛏 ${a.beds} מיטות</span>
        <span class="fact">📐 ${a.sizeM2} מ״ר</span>
        ${a.bathrooms?`<span class="fact">🚿 ${a.bathrooms} חדר רחצה</span>`:''}
      </div>
      ${a.perfectForHe?`<div>מתאים ל: <b>${a.perfectForHe}</b></div>`:''}
      <h3>סידור מיטות</h3><ul>${a.bedSpecHe.map(b=>`<li>${b}</li>`).join('')}</ul>
      <h3>מה יש בדירה</h3><ul>${a.featuresHe.map(f=>`<li>${f}</li>`).join('')}</ul>
      <div class="tags" style="margin-top:8px">${a.highlights.map(h=>`<span class="tag">${LABELS[h]||h}</span>`).join('')}</div>
      ${a.extrasHe.length?`<p style="color:var(--muted);font-size:13px">${a.extrasHe.join(' · ')}</p>`:''}
      <div class="cta">רוצים לשמוע עוד על הדירה או לבדוק זמינות?<br>
        <a href="https://wa.me/${AGENCY_WA}?text=${encodeURIComponent('היי, ראיתי את הדירה '+a.name+' ב-StoliSki ואשמח לפרטים')}">💬 דברו איתנו בוואטסאפ</a></div>
    </main>`;
  const main=document.getElementById('main'), cnt=document.getElementById('cnt');
  const thumbs=[...document.querySelectorAll('#thumbs img')];
  function set(i){ idx=(i+ph.length)%ph.length; main.src=ph[idx].file; cnt.textContent=`${idx+1} / ${ph.length}`;
    thumbs.forEach(t=>t.classList.toggle('on',+t.dataset.i===idx)); if(lb.classList.contains('open')){ lbimg.src=ph[idx].file; lbcnt.textContent=cnt.textContent; } }
  document.getElementById('prev').onclick=()=>set(idx-1);
  document.getElementById('next').onclick=()=>set(idx+1);
  thumbs.forEach(t=>t.onclick=()=>{ set(+t.dataset.i); window.scrollTo({top:0,behavior:'smooth'}); });
  // lightbox
  const lb=document.getElementById('lb'), lbimg=document.getElementById('lbimg'), lbcnt=document.getElementById('lbcnt');
  main.onclick=()=>{ lbimg.src=ph[idx].file; lbcnt.textContent=cnt.textContent; lb.classList.add('open'); };
  document.getElementById('lbx').onclick=()=>lb.classList.remove('open');
  lb.onclick=e=>{ if(e.target===lb) lb.classList.remove('open'); };
  // swipe (hero + lightbox)
  let sx=null;
  const onStart=e=>{ sx=e.touches[0].clientX; };
  const onEnd=e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>40) set(dx<0?idx-1:idx+1); }; // RTL: swipe left = previous
  [main.parentElement, lb].forEach(el=>{ el.addEventListener('touchstart',onStart,{passive:true}); el.addEventListener('touchend',onEnd); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') lb.classList.remove('open'); if(e.key==='ArrowLeft') set(idx+1); if(e.key==='ArrowRight') set(idx-1); });
}
</script>
</body>
</html>
